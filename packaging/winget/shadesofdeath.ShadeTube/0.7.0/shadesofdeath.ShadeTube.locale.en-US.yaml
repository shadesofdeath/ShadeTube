ShortDescription: "Your Spotify library, played from YouTube, in a fast native Windows app."
Description: |-
  ShadeTube is a native Windows music player inspired by Spotube. Sign in with your Spotify account to get your library, playlists and personal home; every song plays from its matching YouTube recording, without ads or Premium. It also plays internet radio, local files and offline MP3 downloads, shows synced lyrics and listening stats, and scrobbles to Last.fm and ListenBrainz. Without a Spotify account it browses the open MusicBrainz catalog. A single self-contained exe drawn with Direct2D; no Electron, no telemetry.
