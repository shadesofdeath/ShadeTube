PackageName: ShadeTube
License: BSD-4-Clause
ShortDescription: "Spotify kitaplığın, YouTube'dan çalan sesle — hızlı, yerel bir Windows uygulamasında."
Description: |-
  ShadeTube, Spotube'dan ilham alan yerel bir Windows müzik çalar. Spotify hesabınla giriş yaparsın; kitaplığın, çalma listelerin ve sana özel ana sayfan gelir, her şarkı eşleşen YouTube kaydından reklamsız ve Premium'suz çalar. İnternet radyosu, yerel dosyalar ve çevrimdışı MP3 indirmeleri, senkron şarkı sözleri, dinleme istatistikleri ve Last.fm / ListenBrainz scrobble da var. Spotify hesabı olmadan açık MusicBrainz kataloğunu gezer. Direct2D ile çizilen tek bir exe; Electron yok, telemetri yok.
